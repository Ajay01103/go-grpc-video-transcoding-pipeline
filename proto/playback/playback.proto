syntax = "proto3";

package playback;

option go_package = "github.com/Ajay01103/go-notion/playback/gen/pb;pb";

message PlaybackRecord {
  string playback_id = 1;
  string asset_id = 2;
  string policy = 3;
  string signing_key_id = 4;
  bool revoked = 5;
  string created_at = 6;
}

message CreatePlaybackRequest {
  string asset_id = 1;
  string policy = 2;
}

message CreatePlaybackResponse {
  PlaybackRecord playback = 1;
}

message ResolvePlaybackRequest {
  string playback_id = 1;
}

message ResolvePlaybackResponse {
  string asset_id = 1;
  string policy = 2;
  bool revoked = 3;
}

message RevokePlaybackRequest {
  string playback_id = 1;
}

message RevokePlaybackResponse {
  bool ok = 1;
}

message IssueTokenRequest {
  string playback_id = 1;
  int64 ttl_seconds = 2;
}

message IssueTokenResponse {
  string token = 1;
}

service PlaybackService {
  rpc CreatePlayback(CreatePlaybackRequest) returns (CreatePlaybackResponse);
  rpc ResolvePlayback(ResolvePlaybackRequest) returns (ResolvePlaybackResponse);
  rpc RevokePlayback(RevokePlaybackRequest) returns (RevokePlaybackResponse);
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse);
}
