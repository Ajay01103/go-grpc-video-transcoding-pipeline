services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    networks:
      - scylladb-network

  scylladb:
    image: scylladb/scylla:latest
    command: >
      --smp 1
      --memory 750M
      --overprovisioned 1
      --developer-mode 1
      --authenticator AllowAllAuthenticator
      --authorizer AllowAllAuthorizer
      --api-address 0.0.0.0
      --broadcast-rpc-address 127.0.0.1
    ports:
      - "${SCYLLA_CQL_PORT:-9042}:9042" # CQL native protocol — the only port your Go service actually needs
      - "${SCYLLA_HTTP_PORT:-10000}:10000" # REST API / Web UI — handy for debugging, drop if you don't use it
    volumes:
      - scylladb-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'select cluster_name from system.local' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - scylladb-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-dev
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # RustFS console
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    networks:
      - scylladb-network

  rustfs-init:
    image: amazon/aws-cli:2.17.40
    container_name: rustfs-init
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for RustFS S3 endpoint..."
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do
          sleep 2
        done

        if aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket uploads >/dev/null 2>&1; then
          echo "Bucket uploads already exists"
        else
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket uploads
          echo "Created bucket uploads"
        fi
    restart: "no"
    networks:
      - scylladb-network

volumes:
  scylladb-data:
    driver: local
  rustfs-data:
    driver: local
  rustfs-logs:
    driver: local
  nats-data:
    driver: local

networks:
  scylladb-network:
    driver: bridge
